[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "castellum"
version = "0.1.0"
description = "AI pipeline orchestration with automatic async I/O, CPU, and GPU management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "llm", "pipeline", "async", "gpu", "embeddings", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typing-extensions>=4.11",
]

[project.urls]
Homepage = "https://github.com/Zikithezikit/castellum"
Repository = "https://github.com/Zikithezikit/castellum"
"Bug Tracker" = "https://github.com/Zikithezikit/castellum/issues"

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
prometheus = ["prometheus-client>=0.20"]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-api>=1.24"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]
all = ["castellum[openai,anthropic,prometheus,otel]"]

[tool.hatch.build.targets.wheel]
packages = ["src/castellum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
